<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>TikTok sign-in</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts.css">
<!-- The TikTok app's redirect URI (tiktok_auth.py). It only shows the one-time code from the
     address so the owner can paste it into tiktok_auth.py. No analytics on this page: the code
     must not leave the browser. -->
<style>
:root{--bg:#0a1628;--surface:#0f2038;--line:#22354f;--fg:#ffffff;--soft:#dfe6ef;--muted:#9fb0c6;--green:#22d07f}
body{margin:0;background:var(--bg);color:var(--soft);font:16px/1.5 Inter,sans-serif;padding:32px 16px}
main{max-width:560px;margin:0 auto}
h1{font:800 26px Archivo,Inter,sans-serif;color:var(--fg);margin:0 0 12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;word-break:break-all;font:600 15px ui-monospace,Menlo,monospace;color:var(--fg)}
button{font:700 15px Inter,sans-serif;background:var(--green);color:#06210b;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1 id="h">TikTok sign-in</h1>
  <p id="p">This page finishes connecting TikTok for the daily drafts (tiktok_auth.py).</p>
  <div class="box" id="code" hidden></div>
  <button type="button" id="copy" hidden>Copy code</button>
  <p><small id="state"></small></p>
</main>
<script>
(function(){
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  const code = q.get('code'), err = q.get('error');
  if (err){ $('h').textContent = 'TikTok said no'; $('p').textContent = (q.get('error_description') || err) + '. Start tiktok_auth.py again.'; return; }
  if (!code) return;
  $('h').textContent = 'Paste this code into tiktok_auth.py';
  $('p').textContent = 'It works once and expires in a few minutes.';
  $('code').textContent = code; $('code').hidden = false; $('copy').hidden = false;
  if (q.get('state')) $('state').textContent = 'Check word: ' + q.get('state');
  $('copy').onclick = async () => { try { await navigator.clipboard.writeText(code); $('copy').textContent = 'Copied'; } catch(e){ $('copy').textContent = 'Select the code and copy it'; } };
  history.replaceState(null, '', location.pathname);   // keep the code out of the address bar and history
})();
</script>
</body>
</html>
