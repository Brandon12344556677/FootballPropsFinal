name: Inactives probe (temporary)
on:
  push:
    branches: [claude/upbeat-dijkstra-rktnaf]
    paths: [.github/workflows/inactives-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import collections, json, datetime
          import news
          def get(url):
              try:
                  return news.get_json(url)
              except Exception as e:
                  print("  fail", url, e)
          def site(path):
              for h in news.ESPN_HOSTS:
                  d = get(f"https://{h}{path}")
                  if d is not None:
                      return d
          for lg in ("basketball/nba", "hockey/nhl", "baseball/mlb", "football/nfl"):
              inj = site(f"/apis/site/v2/sports/{lg}/injuries")
              st = collections.Counter()
              ex = {}
              for t in (inj or {}).get("injuries") or []:
                  for i in t.get("injuries") or []:
                      d = i.get("details") or {}
                      k = (i.get("status"), (i.get("type") or {}).get("description"), (d.get("fantasyStatus") or {}).get("description"))
                      st[k] += 1
                      ex.setdefault(k, (t.get("displayName"), i["athlete"].get("displayName"), i.get("date"), i.get("shortComment", "")[:140]))
              print(f"\n== {lg} injuries: {sum(st.values())}")
              for k, n in st.most_common():
                  print(f"   {n:4d} {k}  e.g. {ex[k]}")
          # NBA / NHL / MLB: upcoming game core roster flags + NHL API rosters
          for lg, sp in (("hockey/nhl", "hockey"), ("basketball/nba", "basketball"), ("baseball/mlb", "baseball")):
              sb = site(f"/apis/site/v2/sports/{lg}/scoreboard")
              evs = (sb or {}).get("events") or []
              print(f"\n== {lg} scoreboard:", [(e["id"], e["shortName"], e["status"]["type"]["name"], e["date"]) for e in evs][:8])
              for e in evs[:2]:
                  comp = e["competitions"][0]
                  for c in comp["competitors"][:1]:
                      lgname = lg.split("/")[1]
                      r = get(f"https://sports.core.api.espn.com/v2/sports/{sp}/leagues/{lgname}/events/{e['id']}/competitions/{comp['id']}/competitors/{c['id']}/roster")
                      ents = (r or {}).get("entries") or []
                      print("  core roster", e["shortName"], len(ents), sorted(ents[0].keys()) if ents else None,
                            collections.Counter((x.get("active"), x.get("starter"), x.get("didNotPlay")) for x in ents))
                  s = site(f"/apis/site/v2/sports/{lg}/summary?event={e['id']}")
                  bx = (s or {}).get("boxscore") or {}
                  print("  summary boxscore keys", sorted(bx.keys()), "players blocks", len(bx.get("players") or []),
                        "rosters", len((s or {}).get("rosters") or []))
          today = datetime.date.today().isoformat()
          sch = get(f"https://api-web.nhle.com/v1/schedule/{today}")
          gms = [g for w in (sch or {}).get("gameWeek") or [] for g in w.get("games") or []]
          print("\n== NHL API games:", [(g["id"], g["awayTeam"]["abbrev"], g["homeTeam"]["abbrev"], g["startTimeUTC"], g["gameState"]) for g in gms[:6]])
          for g in gms[:3]:
              pbp = get(f"https://api-web.nhle.com/v1/gamecenter/{g['id']}/play-by-play")
              rs = (pbp or {}).get("rosterSpots") or []
              print("  pbp rosterSpots", g["id"], g["gameState"], len(rs), rs[0] if rs else None)
              ld = get(f"https://api-web.nhle.com/v1/gamecenter/{g['id']}/landing")
              print("  landing keys", sorted((ld or {}).keys()))
              m = (ld or {}).get("matchup") or {}
              print("  matchup keys", sorted(m.keys()), json.dumps(m.get("goalieComparison") or {})[:400])
          PY
