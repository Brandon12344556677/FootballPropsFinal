name: Update NFL data

# Pulls fresh stats (nflverse + ESPN box scores for games nflverse hasn't posted
# yet), grades finished picks, refreshes the boards and Polymarket prices, and
# redeploys. Also builds the NBA, NHL and MLB pages (non-fatal: a failure there never
# blocks the NFL deploy).
on:
  schedule:
    # Every 20 minutes (:05, :25, :45), and each run updates twice, 10 minutes apart
    # (update_pass.sh), so the site refreshes about every 10 minutes. A 10-minute cron
    # doesn't work: GitHub delays and drops frequent scheduled runs under load (after
    # switching to one, no run started for 22 minutes), while this 20-minute schedule
    # has fired reliably, 8-10 minutes after each slot. Fresh prices matter for the NBA,
    # NHL and MLB pages (they show the prices baked in at build time) and for each pick's
    # closing price; the NFL board also fetches live prices in the browser. A pass takes
    # ~2 min; the concurrency group below queues a run rather than overlapping one. No
    # builder records or changes a pick once its game has started, so a pass mid-game is
    # safe. Off the top of the hour, where GitHub delays scheduled runs the most.
    - cron: "5,25,45 * * * *"
  # Each run also starts the next one when it ends (the last step), so the site keeps updating
  # when GitHub's scheduler stalls: on 2026-10-11 it started nothing from 22:56 to past 00:26 UTC.
  # The schedule above stays as a backup that restarts the chain if a run is ever lost. The
  # concurrency group below keeps one run going and at most one waiting, so the chain and the
  # schedule merge instead of piling up.
  workflow_dispatch:
    inputs:
      chain:
        description: "Set by the previous run when it starts this one (two passes, then the next run)"
        required: false
        default: ""
      probe:
        description: "Set to 1 to log an NBA endpoint connectivity probe"
        required: false
        default: ""
      post:
        description: "Set to 1 to send the daily Discord/Telegram post now (for testing)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write    # the last step starts the next run (workflow_dispatch)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # The image every run so far has used. On 2026-10-05 two runs on ubuntu-latest were never
    # given a runner and were cancelled after 15 minutes; pinning skips that label's queue.
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # a backstop; the update step below has its own, shorter limit
    steps:
      # Pushes with the DEPLOY_KEY deploy key (write access), which the main-branch ruleset
      # lets bypass its pull-request rule. The default token would be refused.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two passes of update_pass.sh (every builder, the health check, commit + push), the
      # second 10 minutes after the first began; a chained run then waits out the rest of 20
      # minutes, so passes stay ~10 minutes apart. A manual run does one pass.
      - name: Update the site (two passes, 10 minutes apart)
        # Normally ~19 minutes. A hung pass fails this step instead of holding the run for hours,
        # and the next step still starts the next run (a timed-out step counts as failed, not cancelled).
        timeout-minutes: 32
        env:
          NBA_PROBE: ${{ github.event.inputs.probe }}
          NHL_PROBE: ${{ github.event.inputs.probe }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}   # the daily picks email (post_daily.py)
          POST_NOW: ${{ github.event.inputs.post }}
          # team_stats.py: GoatCounter API key ("Read statistics" only) and the /team/ page password
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          TEAM_DASH_PASSWORD: ${{ secrets.TEAM_DASH_PASSWORD }}
        run: |
          start=$(date +%s)
          bash update_pass.sh
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.chain }}" = "1" ]; then
            wait=$(( start + 600 - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            timeout 2m git pull --rebase --autostash origin main || true    # anything merged meanwhile
            bash update_pass.sh
            if [ "${{ github.event.inputs.chain }}" = "1" ]; then
              wait=$(( start + 1140 - $(date +%s) ))             # the next run takes ~1 min to start
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          fi

      # Start the next run, even after a failed pass (only a cancelled run ends the chain: a newer
      # one replaced it). A run started by GITHUB_TOKEN through workflow_dispatch does run.
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /dev/null -w "next run requested: HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true

      # Last, after the site is pushed: turns the run red (so GitHub emails you) when a
      # problem has lasted ~3 hours (18 passes in a row), then at most once a day while it lasts.
      - name: Alert if a data source keeps failing
        run: python health.py --gate
