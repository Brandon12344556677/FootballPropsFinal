name: Update NFL data

# Pulls fresh stats (nflverse + ESPN box scores for games nflverse hasn't posted
# yet), grades finished picks, refreshes this week's board, and redeploys.
# Runs the morning catch-all plus the nights games finish so results post within
# hours. Cron is UTC; ET times are approximate (shift 1h with daylight saving).
on:
  schedule:
    - cron: "0 9 * * *"   # daily ~5 AM ET  — catch-all
    - cron: "0 5 * * 5"   # Fri ~1 AM ET    — after Thursday Night Football
    - cron: "0 5 * * 1"   # Mon ~1 AM ET    — after Sunday games + SNF
    - cron: "0 5 * * 2"   # Tue ~1 AM ET    — after Monday Night Football
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site data
        run: python build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json slate.json picks.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update NFL data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
