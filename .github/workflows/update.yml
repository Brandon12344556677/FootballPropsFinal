name: Update NFL data

# Pulls fresh stats (nflverse + ESPN box scores for games nflverse hasn't posted
# yet), grades finished picks, refreshes this week's board, and redeploys. Also
# builds the NBA page from ESPN box scores (non-fatal: an NBA failure never blocks
# the NFL deploy). Cron is UTC; ET times are approximate (shift 1h with DST).
on:
  schedule:
    # Grading / catch-all runs (after games finish)
    - cron: "0 9 * * *"   # daily ~5 AM ET  — catch-all
    - cron: "0 5 * * 5"   # Fri ~1 AM ET    — after Thursday Night Football
    - cron: "0 5 * * 1"   # Mon ~1 AM ET    — after Sunday games + SNF
    - cron: "0 5 * * 2"   # Tue ~1 AM ET    — after Monday Night Football
    # Pre-kickoff snapshot runs — fire shortly before the standard NFL slots so the
    # board frozen into Past picks is the one right before kickoff, not the 5 AM one.
    # build.py stops refreshing a pick once its game has started, so each game keeps
    # the last run before its own kickoff. UTC assumes EDT; in EST (after early Nov)
    # they fire ~1 h earlier ET — still safely pre-kickoff, just a bit further out.
    - cron: "30 16 * * 0" # Sun ~12:30 PM ET — before the 1 PM slate
    - cron: "50 19 * * 0" # Sun ~3:50 PM ET  — before the 4 PM slate
    - cron: "50 23 * * 0" # Sun ~7:50 PM ET  — before Sunday Night Football
    - cron: "45 23 * * 1" # Mon ~7:45 PM ET  — before Monday Night Football
    - cron: "45 23 * * 4" # Thu ~7:45 PM ET  — before Thursday Night Football
    # Odd-slot coverage — extra pre-kickoff snapshots for non-standard windows
    # (international mornings, Saturday/holiday games). Most weeks these just no-op;
    # the kickoff freeze in build.py keeps them correct whenever they do fire. These
    # slots are almost all late-season (EST), so times target EST and fire early in EDT.
    - cron: "0 13 * * 0"  # Sun ~8-9 AM ET   — before 9:30 AM international games
    - cron: "30 17 * * 6" # Sat ~12:30 PM ET — before ~1 PM Saturday games
    - cron: "0 21 * * 6"  # Sat ~4 PM ET     — before ~4:30 PM Saturday games
    - cron: "50 0 * * 0"  # Sat ~7:50 PM ET  — before Saturday night games (Sun in UTC)
    - cron: "30 19 * * 5" # Fri ~2:30 PM ET  — before the Black Friday game
    - cron: "0 17 * * 4"  # Thu ~12 PM ET    — before the Thanksgiving noon game
    - cron: "0 21 * * 4"  # Thu ~4 PM ET     — before the Thanksgiving afternoon game
  workflow_dispatch:
    inputs:
      probe:
        description: "Set to 1 to log an NBA endpoint connectivity probe"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site data
        run: python build.py

      - name: Build NBA data (non-fatal)
        continue-on-error: true
        timeout-minutes: 6
        env:
          NBA_PROBE: ${{ github.event.inputs.probe }}
        run: python build_nba.py || echo "NBA build failed — skipping NBA files this run"

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json slate.json picks.json weekly.json sitemap.xml robots.txt
          git add nba.html nba.json nba_stats.json nba_picks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Push with rebase-retry so two runs finishing close together can't
            # fail on a non-fast-forward.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed"; break
              fi
              echo "push rejected, rebasing (attempt $i)…"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi
