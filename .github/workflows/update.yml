name: Update NFL data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site data
        run: python build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json slate.json picks.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update NFL data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
