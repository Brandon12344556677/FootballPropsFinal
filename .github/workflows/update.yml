name: Update NFL data

# Pulls fresh stats (nflverse + ESPN box scores for games nflverse hasn't posted
# yet), grades finished picks, refreshes the boards and Polymarket prices, and
# redeploys. Also builds the NBA, NHL and MLB pages (non-fatal: a failure there never
# blocks the NFL deploy).
on:
  schedule:
    # Hourly, at :40 — 20-50 min before the usual :00/:15/:30 NFL/NBA/NHL/MLB starts,
    # so boards and prices are fresh right before games begin. No builder records or
    # changes a pick once its game has started, so an hourly run mid-game is safe.
    # Off the top of the hour, where GitHub delays scheduled runs the most.
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Set to 1 to log an NBA endpoint connectivity probe"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site data
        run: python build.py

      - name: Build NBA data (non-fatal)
        continue-on-error: true
        timeout-minutes: 6
        env:
          NBA_PROBE: ${{ github.event.inputs.probe }}
        run: python build_nba.py || echo "NBA build failed — skipping NBA files this run"

      - name: Build NHL data (non-fatal)
        continue-on-error: true
        timeout-minutes: 6
        env:
          NHL_PROBE: ${{ github.event.inputs.probe }}
        run: python build_nhl.py || echo "NHL build failed — skipping NHL files this run"

      - name: Build MLB data (non-fatal)
        continue-on-error: true
        timeout-minutes: 7
        run: python build_mlb.py || echo "MLB build failed — skipping MLB files this run"

      - name: Build the home page's Today feed (non-fatal)
        continue-on-error: true
        run: python build_today.py || echo "today.json not rebuilt this run"

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl.html data.json slate.json picks.json weekly.json sitemap.xml robots.txt
          for f in nba.html nba.json nba_stats.json nba_picks.json \
                   nhl.html nhl.json nhl_stats.json nhl_picks.json \
                   mlb.html mlb.json mlb_stats.json mlb_picks.json today.json; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Push with rebase-retry so two runs finishing close together can't
            # fail on a non-fast-forward.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed"; break
              fi
              echo "push rejected, rebasing (attempt $i)…"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi
