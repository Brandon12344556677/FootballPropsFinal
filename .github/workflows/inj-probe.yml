name: Next man up check (temporary)
on:
  push:
    branches: [claude/upbeat-dijkstra-rktnaf]
    paths: [.github/workflows/inj-probe.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          timeout 10m python build.py > /tmp/b.log 2>&1; echo "exit $?"
          grep -iE "next man up|Traceback|Error" /tmp/b.log | tail -5
          python - <<'PY'
          import json
          d = json.load(open("data.json"))
          adj = [p for p in d["players"] if p.get("inj_boost")]
          print("adjusted:", len(adj), "| role changes:", sum(1 for p in adj if p["inj_boost"].get("role")))
          for p in adj:
              if p["t"] == "PHI":
                  print("  PHI", p["n"], p["p"], p["inj_boost"])
          pk = json.load(open("picks.json")); c = pk["cols"]
          pend = [dict(zip(c, r)) for r in pk["picks"]]
          pend = [p for p in pend if p["src"] == "live" and p["res"] is None]
          print("pending", len(pend), "| role-change picks", sum(1 for p in pend if p.get("rc")),
                "| T", sum("T" in (p["lists"] or "") for p in pend), "| V", sum("V" in (p["lists"] or "") for p in pend))
          for p in pend:
              if p["player"] in ("Dontayvion Wicks", "Braelon Allen") and p.get("lists") is not None:
                  print("   ", p["player"], p["stat"], p["side"], p["line"], p["prob"], "lists", p["lists"] or "-", "rc", p.get("rc"))
          PY
