name: Kalshi probe (temporary)

# TEMPORARY, working branch only: runs every builder with the Kalshi code on a runner (which can
# reach Kalshi) and logs what it priced. Commits nothing. Deleted before the Kalshi PR merges.
on:
  push:
    branches: [claude/upbeat-dijkstra-rktnaf]
    paths: [kalshi_probe.py, .github/workflows/kalshi-probe.yml]

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python kalshi_probe.py || true
