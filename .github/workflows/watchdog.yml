name: Site watchdog

# Checks the live site from the outside every 30 minutes (watchdog.py): the update job is
# still running and passing, the data is fresh, every main page and data file loads, and
# each board opens in headless Chrome without script errors. A problem opens one GitHub
# issue (updated as it changes, closed when it's fixed); the run itself goes red only when
# it opens a new issue, so GitHub's failure email fires once per problem, not every check.
# Started by every update run when it ends (update.yml, "Start a watchdog check"), so it runs about
# every 20 minutes. The schedule below is a backup: GitHub has gone hours without starting it
# (Nov 6, 2026: nothing between 03:25 and 11:30 UTC, then nothing after). Off the update job's
# :05/:25/:45 slots, so the two don't compete for a runner.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write    # the update job's recent runs, and starting one when the chain has stopped (watchdog.restart_chain)
  issues: write     # open, update and close the watchdog issue

concurrency:
  group: watchdog
  cancel-in-progress: false   # a new check waits for the one running (at most one waiting), never cuts it off mid-check

jobs:
  check:
    runs-on: ubuntu-24.04   # comes with Google Chrome, which the render check uses
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the live site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watchdog.py

      # The team dashboard (dashboard_check.py): page, encrypted numbers (opened with the team
      # password), edge tracker and feeds. Runs even when the step above turned the run red.
      - name: Check the team dashboard
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM_DASH_PASSWORD: ${{ secrets.TEAM_DASH_PASSWORD }}
        run: python dashboard_check.py
