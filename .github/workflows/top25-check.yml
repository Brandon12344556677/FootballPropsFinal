name: Top 25 check (temporary)
on:
  push:
    branches: [claude/upbeat-dijkstra-rktnaf]
    paths: [.github/workflows/top25-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          timeout 10m python build.py > /tmp/b.log 2>&1; echo "exit $?"
          grep -E "depth:|Traceback|Error|429" /tmp/b.log | tail -4
          python - <<'PY'
          import json, collections
          d = json.load(open("picks.json")); c = d["cols"]
          ps = [dict(zip(c, r)) for r in d["picks"]]
          pend = [p for p in ps if p["src"] == "live" and p["res"] is None and not p.get("lk")]
          T = sorted((p for p in pend if "T" in (p["lists"] or "")), key=lambda p: -p["prob"])
          V = [p for p in pend if "V" in (p["lists"] or "")]
          dup = sum(n - 1 for n in collections.Counter((p["gid"], p["pid"], p["stat"]) for p in T).values())
          print("T", len(T), "| T duplicate props", dup, "| T thin", sum(1 for p in T if p.get("th")), "| T no price", sum(1 for p in T if p.get("price") is None), "| V", len(V))
          for p in T:
              print(f'  T {p["player"]:22s} {p["stat"]:9s} {p["side"]:5s} {p["line"]:6} model {p["prob"]:.3f} price {p["price"]}c on {p["vn"]}')
          PY
