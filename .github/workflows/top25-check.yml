name: Top 25 check (temporary)
on:
  push:
    branches: [claude/upbeat-dijkstra-rktnaf]
    paths: [.github/workflows/top25-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          timeout 10m python build.py > /tmp/b.log 2>&1; echo "exit $?"
          grep -E "depth:|next man up|Traceback|Error|429" /tmp/b.log | tail -6
          python - <<'PY'
          import json
          d = json.load(open("picks.json")); c = d["cols"]
          ps = [dict(zip(c, r)) for r in d["picks"]]
          pend = [p for p in ps if p["src"] == "live" and p["res"] is None and not p.get("lk")]
          T = sorted((p for p in pend if "T" in (p["lists"] or "")), key=lambda p: -p["prob"])
          V = [p for p in pend if "V" in (p["lists"] or "")]
          print("T", len(T), "| V", len(V), "| held", sum(1 for p in pend if p.get("hd")))
          for p in T:
              print(f'  T {p["player"]:22s} {p["stat"]:9s} {p["side"]:5s} {p["line"]:6} model {p["prob"]:.3f} price {p["price"]}c on {p["vn"]} | $ near price: P {p.get("pd")} K {p.get("kd")}')
          for p in sorted(V, key=lambda p: -(p["prob"] - p["price"] / 100))[:10]:
              print(f'  V {p["player"]:22s} {p["stat"]:9s} {p["side"]:5s} {p["line"]:6} model {p["prob"]:.3f} price {p["price"]}c')
          PY
