name: Next man up check (temporary)

# TEMPORARY, working branch only: backtests next man up on past seasons and runs the NFL
# builder with it (nothing is committed). Deleted before the PR merges.
on:
  push:
    branches: [claude/upbeat-dijkstra-rktnaf]
    paths: [.github/workflows/injury-check.yml, tune_injury.py]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest
        run: timeout 25m python tune_injury.py 2>&1 | grep -v "^  stats\|^  snaps\|Downloading" | tail -80 || true
      - name: NFL build with next man up (not committed)
        run: |
          timeout 10m python build.py > /tmp/b.log 2>&1; echo "exit $?"
          grep -iE "next man up|Traceback|Error|slate:|depth:" /tmp/b.log | tail -10
          python - <<'PY'
          import json
          d = json.load(open("data.json"))
          adj = [p for p in d["players"] if p.get("inj_boost")]
          print("adjusted players:", len(adj))
          for p in sorted(adj, key=lambda p: -max(v for k, v in p["inj_boost"].items() if k != "why"))[:15]:
              print("  ", p["n"], p["t"], p["p"], p["inj_boost"])
          pk = json.load(open("picks.json")); c = pk["cols"]
          for r in pk["picks"]:
              p = dict(zip(c, r))
              if p["src"] == "live" and p["res"] is None and p["player"] in ("Braelon Allen", "Isaiah Davis") and p["stat"] == "rush_yds":
                  print("  PICK", p["player"], p["stat"], p["side"], p["line"], "prob", p["prob"], "price", p["price"], "lists", p["lists"] or "-")
          PY
