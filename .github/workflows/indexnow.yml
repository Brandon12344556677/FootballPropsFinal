name: IndexNow (tell Bing which pages to re-read)

# Once a day, every URL in sitemap.xml goes to IndexNow (indexnow.py), so Bing re-reads the site
# without anyone submitting pages by hand. Also runs by hand (workflow_dispatch).
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python indexnow.py
